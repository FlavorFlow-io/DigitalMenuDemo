# Releases a new build of a client that is already on Google Play, through
# the Play Developer API. A client's first release goes through
# create-play-app.yml instead.
#
# Needs the secrets TEST_API_KEY and PLAY_SERVICE_ACCOUNT_JSON (the whole
# service-account key) and the variable TEST_PROJECT_ID.
name: Release White-Label Update

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      client_id:
        description: 'FlavorFlow client id to build and publish'
        required: false
        default: ''
      client_name:
        description: 'Client name (labels the run)'
        required: false
        default: ''
      app_name:
        description: 'App name'
        required: false
        default: ''
      package_name:
        description: 'Package name — fastlane uploads against this'
        required: false
        default: ''
      publish_to_production:
        description: 'Also publish to production (public, cannot be undone)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build
    if: inputs.client_id != ''
    uses: ./.github/workflows/build-white-label.yml
    with:
      client_id: ${{ inputs.client_id }}
      client_name: ${{ inputs.client_name }}
    secrets: inherit

  internal-release:
    name: Internal release for '${{ inputs.client_name }}' (fastlane)
    needs: build
    if: inputs.client_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Locate the bundle
        id: bundle
        run: |
          set -euo pipefail
          aab=$(find bundle -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No .aab to upload."; exit 1; }
          echo "path=$(cd "$(dirname "$aab")" && pwd)/$(basename "$aab")" >> "$GITHUB_OUTPUT"
          ls -lh "$aab"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N --no-document

      - name: Upload to internal testing
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
          FASTLANE_OPT_OUT_USAGE: '1'
        run: |
          set -euo pipefail
          fastlane supply \
            --package_name '${{ inputs.package_name }}' \
            --aab '${{ steps.bundle.outputs.path }}' \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true --skip_upload_images true \
            --skip_upload_screenshots true --skip_upload_changelogs true

      - name: Report
        run: |
          {
            echo "### Internal release (fastlane)"
            echo "- Package: \`${{ inputs.package_name }}\`"
            echo "- Bundle: \`$(basename '${{ steps.bundle.outputs.path }}')\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-to-production:
    name: Promote '${{ inputs.client_name }}' to production
    needs: internal-release
    if: inputs.publish_to_production && needs.internal-release.result == 'success'
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5

      - name: Promote in Play Console
        # Keep the action and cli-version on the same release.
        uses: FlavorFlow-io/create-play-app-action@v1.2.1
        with:
          cli-version: v1.2.1
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          form: ''
          publish-to-production: true

      - name: Report
        run: |
          {
            echo "### Promoted to production"
            echo "- Package: \`${{ inputs.package_name }}\`"
            echo "- Now in review with Google."
          } >> "$GITHUB_STEP_SUMMARY"
