# Releases a new build of a client that is already on Google Play, through
# the Play Developer API with fastlane. A client's first release goes through
# create-play-app.yml instead, which also sets the production countries.
#
# Needs the secrets TEST_API_KEY and PLAY_SERVICE_ACCOUNT_JSON (the whole
# service-account key) and the variable TEST_PROJECT_ID.
name: Release White-Label Update

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'FlavorFlow client id to build and publish'
        required: false
        default: ''
      client_name:
        description: 'Client name (labels the run)'
        required: false
        default: ''
      package_name:
        description: 'Package name — fastlane uploads against this'
        required: false
        default: ''
      publish_to_production:
        description: 'Also publish to production (public, cannot be undone)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build
    if: inputs.client_id != ''
    uses: ./.github/workflows/build-white-label.yml
    with:
      client_id: ${{ inputs.client_id }}
    secrets: inherit

  release:
    name: Release '${{ inputs.client_name }}'
    needs: build
    if: inputs.client_id != ''
    runs-on: ubuntu-latest
    env:
      SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
    steps:
      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Locate the bundle
        id: bundle
        run: |
          set -euo pipefail
          aab=$(find bundle -name '*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No .aab to upload."; exit 1; }
          echo "path=$(cd "$(dirname "$aab")" && pwd)/$(basename "$aab")" >> "$GITHUB_OUTPUT"
          info=$(find bundle -name release-info.json | head -1)
          [ -n "$info" ] && echo "version_code=$(jq -r .version_code "$info")" >> "$GITHUB_OUTPUT"
          ls -lh "$aab"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install fastlane
        run: gem install fastlane -N --no-document

      - name: Upload to internal testing
        run: |
          set -euo pipefail
          fastlane supply \
            --package_name '${{ inputs.package_name }}' \
            --aab '${{ steps.bundle.outputs.path }}' \
            --track internal \
            --release_status completed \
            --skip_upload_metadata true --skip_upload_images true \
            --skip_upload_screenshots true --skip_upload_changelogs true

      - name: Promote to production
        if: inputs.publish_to_production
        run: |
          set -euo pipefail
          version_code='${{ steps.bundle.outputs.version_code }}'
          [ -n "$version_code" ] || { echo "::error::No version code for the bundle, so there is nothing to promote."; exit 1; }
          fastlane supply \
            --package_name '${{ inputs.package_name }}' \
            --track internal \
            --track_promote_to production \
            --version_code "$version_code" \
            --release_status completed \
            --skip_upload_aab true --skip_upload_apk true \
            --skip_upload_metadata true --skip_upload_images true \
            --skip_upload_screenshots true --skip_upload_changelogs true

      - name: Summary
        run: |
          {
            echo "### Release"
            echo "- Package: \`${{ inputs.package_name }}\`"
            echo "- Version code: ${{ steps.bundle.outputs.version_code }}"
            echo "- Internal testing: done"
            echo "- Production: ${{ inputs.publish_to_production && 'submitted for review' || 'not requested' }}"
          } >> "$GITHUB_STEP_SUMMARY"
