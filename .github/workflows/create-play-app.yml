# Publishes a new FlavorFlow client to Google Play for the first time: builds
# it, creates the Play app, fills its forms and releases it to internal testing.
# Later releases go through release-white-label-update.yml.
#
# FlavorFlow runs this when a client is added to the project. Answers (testers,
# categories, countries…) are edited in the FlavorFlow app, not here.
#
# Needs the secret TEST_API_KEY: a FlavorFlow project API key with write access.
name: Create Play App

# FlavorFlow matches runs to clients by the client id in this name.
run-name: ${{ inputs.client_id && format('Client {0}', inputs.client_id) || 'Create Play App' }}

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'FlavorFlow project id'
        required: true
      client_id:
        description: 'FlavorFlow client id'
        required: true
      publish_to_production:
        description: 'Also publish to production (public, cannot be undone)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-white-label.yml
    with:
      client_id: ${{ inputs.client_id }}
    secrets: inherit

  first_release:
    name: >-
      First release for ${{ needs.build.outputs.client_name || inputs.client_id }}
    needs: build
    # Drives a real browser signed in to Play Console.
    runs-on: [self-hosted, macOS]
    # There is only one such runner; don't let a stuck run block the others.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Download the store listing images
        uses: actions/download-artifact@v7
        with:
          pattern: listing-*
          merge-multiple: true
          path: listing

      # NOT REQUIRED - Just for debug
      # Set the repository variable RECORD_SCREEN=false to turn this off.
      - name: Start screen recording
        id: start_recording
        if: vars.RECORD_SCREEN != 'false'
        run: |
          set -euo pipefail
          video="$RUNNER_TEMP/play-console-${{ github.run_id }}.mp4"
          log="$RUNNER_TEMP/recorder.log"
          if ! command -v ffmpeg >/dev/null; then
            echo "::warning::ffmpeg is not installed; not recording."
            exit 0
          fi
          # ffmpeg exits non-zero when only listing devices, hence `|| true`.
          screen_device=$(ffmpeg -f avfoundation -list_devices true -i "" 2>&1 \
            | awk -F'[][]' '/Capture screen/ {print $4; exit}' || true)
          if [ -z "$screen_device" ]; then
            echo "::warning::No screen capture device found; not recording."
            exit 0
          fi
          ffmpeg -nostdin -y -f avfoundation -framerate 4 -i "${screen_device}:none" \
            -vf "scale=1280:-2" -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            "$video" > "$log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/recorder.pid"
          echo "video=$video" >> "$GITHUB_OUTPUT"
          sleep 4
          if ! kill -0 "$(cat "$RUNNER_TEMP/recorder.pid")" 2>/dev/null; then
            echo "::warning::Recording stopped at once. Grant the runner Screen Recording in System Settings → Privacy & Security."
            cat "$log"
          fi

      - name: Create the Play app, fill its forms and release it
        id: create_app
        # Keep the action and cli-version on the same release.
        uses: FlavorFlow-io/create-play-app-action@v1.2.2
        with:
          cli-version: v1.2.2
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          form: all
          bundle: bundle
          store-listing: listing
          grant-service-account: true
          publish-to-production: ${{ inputs.publish_to_production }}

      # NOT REQUIRED - Just for debug
      - name: Stop screen recording
        if: always() && steps.start_recording.outputs.video != ''
        run: |
          pid=$(cat "$RUNNER_TEMP/recorder.pid" 2>/dev/null || true)
          [ -n "$pid" ] || exit 0
          # SIGINT lets ffmpeg finish writing the file so it can be played.
          kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true

      # NOT REQUIRED - Just for debug
      - name: Upload the recording
        if: always() && steps.start_recording.outputs.video != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-console-recording-${{ github.run_id }}
          path: ${{ steps.start_recording.outputs.video }}
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        run: |
          {
            echo "### First release"
            echo "- Play app id: \`${{ steps.create_app.outputs.app-id }}\`"
            echo "- Created in this run: ${{ steps.create_app.outputs.created }}"
            echo ""
            echo "Next releases run through **Release White-Label Update**."
          } >> "$GITHUB_STEP_SUMMARY"
