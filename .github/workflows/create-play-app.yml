# Publishes a new FlavorFlow client to Google Play for the first time: builds
# it, creates the Play app, fills its forms and releases it to internal testing.
# Later releases go through release-white-label-update.yml.
#
# FlavorFlow runs this when a client is added to the project. Answers (testers,
# categories, countries…) are edited in the FlavorFlow app, not here.
#
# Needs the secret TEST_API_KEY: a FlavorFlow project API key with write access.
name: Create Play App

# FlavorFlow matches runs to clients by this name.
run-name: >-
  ${{ inputs.client_id && format('{0} ({1})', inputs.client_name || 'client', inputs.client_id)
   || 'Create Play App' }}

on:
  workflow_dispatch:
    # FlavorFlow sends all of these, so all must be declared.
    inputs:
      event:
        description: 'FlavorFlow event name (e.g. client.added)'
        required: false
      project_id:
        description: 'FlavorFlow project id'
        required: false
      project_name:
        description: 'FlavorFlow project name'
        required: false
      client_id:
        description: 'FlavorFlow client id'
        required: false
      client_name:
        description: 'Client name'
        required: false
      app_name:
        description: 'App name'
        required: false
      package_name:
        description: 'Package name'
        required: false
      payload:
        description: 'Full event as JSON'
        required: false
      publish_to_production:
        description: 'Also publish to production (public, cannot be undone)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build
    if: inputs.client_id != ''
    uses: ./.github/workflows/build-white-label.yml
    with:
      client_id: ${{ inputs.client_id }}
      client_name: ${{ inputs.client_name }}
    secrets: inherit

  first_release:
    name: >-
      First release for ${{ needs.build.outputs.client_name || inputs.client_name
       || inputs.client_id || 'a new client' }}
    needs: build
    # Drives a real browser signed in to Play Console.
    runs-on: [self-hosted, macOS]
    # There is only one such runner; don't let a stuck run block the others.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Download the store listing images
        uses: actions/download-artifact@v7
        with:
          pattern: listing-*
          merge-multiple: true
          path: listing

      # One `key=path` line per file. Translations get a `@locale` suffix,
      # e.g. `phone_screenshots@pt-BR`.
      - name: List the files to upload
        id: upload_files
        run: |
          set -euo pipefail
          default_locale=en-US
          listing_dir=$(cd listing 2>/dev/null && pwd || echo /nonexistent)

          bundle=$(find bundle -name '*.aab' | head -1)
          if [ -z "$bundle" ]; then
            echo "::error::No .aab was built. Are the signing secrets set?"
            exit 1
          fi
          files="aab=$(cd "$(dirname "$bundle")" && pwd)/$(basename "$bundle")"$'\n'
          add() { files="${files}$1=$2"$'\n'; }

          icon="$listing_dir/$default_locale/images/icon.png"
          if [ -f "$icon" ]; then
            add app_icon "$icon"
          else
            echo "::warning::No app icon found."
          fi

          for locale_dir in "$listing_dir"/*/; do
            [ -d "$locale_dir" ] || continue
            locale=$(basename "$locale_dir")
            suffix=""
            [ "$locale" = "$default_locale" ] || suffix="@$locale"

            feature_graphic="$locale_dir/images/feature_graphic.png"
            [ -f "$feature_graphic" ] && add "feature_graphic$suffix" "$feature_graphic"

            screenshots=$(find "$locale_dir" -path '*phoneScreenshots*' -name '*.png' | sort | paste -sd, - || true)
            if [ -n "$screenshots" ]; then
              add "phone_screenshots$suffix" "$screenshots"
            elif [ "$locale" = "$default_locale" ]; then
              echo "::warning::No phone screenshots found. Play requires at least two."
            fi
          done

          printf 'Files to upload:\n%s' "$files"
          { echo "list<<EOF"; printf '%s' "$files"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      # Written by the build next to the bundle.
      - name: Read the bundle's version
        id: version
        run: |
          info=$(find bundle -name release-info.json | head -1)
          [ -n "$info" ] || { echo "::notice::No release-info.json; the version will not be saved."; exit 0; }
          echo "name=$(jq -r .version_name "$info")" >> "$GITHUB_OUTPUT"
          echo "code=$(jq -r .version_code "$info")" >> "$GITHUB_OUTPUT"

      # Optional. Without it, the Data safety CSV uploaded in FlavorFlow is used.
      - name: Find a Data safety CSV in this repository
        id: data_safety
        run: |
          if [ -f play/data-safety.csv ]; then
            echo "csv=$(pwd)/play/data-safety.csv" >> "$GITHUB_OUTPUT"
          fi

      # Set the repository variable RECORD_SCREEN=false to turn this off.
      - name: Start screen recording
        id: start_recording
        if: vars.RECORD_SCREEN != 'false'
        run: |
          set -euo pipefail
          video="$RUNNER_TEMP/play-console-${{ github.run_id }}.mp4"
          log="$RUNNER_TEMP/recorder.log"
          if ! command -v ffmpeg >/dev/null; then
            echo "::warning::ffmpeg is not installed; not recording."
            exit 0
          fi
          # ffmpeg exits non-zero when only listing devices, hence `|| true`.
          screen_device=$(ffmpeg -f avfoundation -list_devices true -i "" 2>&1 \
            | awk -F'[][]' '/Capture screen/ {print $4; exit}' || true)
          if [ -z "$screen_device" ]; then
            echo "::warning::No screen capture device found; not recording."
            exit 0
          fi
          ffmpeg -nostdin -y -f avfoundation -framerate 4 -i "${screen_device}:none" \
            -vf "scale=1280:-2" -c:v libx264 -preset veryfast -pix_fmt yuv420p \
            "$video" > "$log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/recorder.pid"
          echo "video=$video" >> "$GITHUB_OUTPUT"
          sleep 4
          if ! kill -0 "$(cat "$RUNNER_TEMP/recorder.pid")" 2>/dev/null; then
            echo "::warning::Recording stopped at once. Grant the runner Screen Recording in System Settings → Privacy & Security."
            cat "$log"
          fi

      - name: Create the Play app, fill its forms and release it
        id: create_app
        # Keep the action and cli-version on the same release.
        uses: FlavorFlow-io/create-play-app-action@v1.2.1
        with:
          cli-version: v1.2.1
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          form: all
          form-params: ${{ steps.upload_files.outputs.list }}
          data-safety-csv: ${{ steps.data_safety.outputs.csv }}
          version-name: ${{ steps.version.outputs.name }}
          version-code: ${{ steps.version.outputs.code }}
          grant-service-account: true
          publish-to-production: ${{ inputs.publish_to_production }}

      - name: Stop screen recording
        if: always() && steps.start_recording.outputs.video != ''
        run: |
          pid=$(cat "$RUNNER_TEMP/recorder.pid" 2>/dev/null || true)
          [ -n "$pid" ] || exit 0
          # SIGINT lets ffmpeg finish writing the file so it can be played.
          kill -INT "$pid" 2>/dev/null || true
          for _ in $(seq 1 60); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$pid" 2>/dev/null || true

      - name: Upload the recording
        if: always() && steps.start_recording.outputs.video != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-console-recording-${{ github.run_id }}
          path: ${{ steps.start_recording.outputs.video }}
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        run: |
          {
            echo "### First release"
            echo "- Play app id: \`${{ steps.create_app.outputs.app-id }}\`"
            echo "- Version: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo "- Created in this run: ${{ steps.create_app.outputs.created }}"
            echo ""
            echo "Next releases run through **Release White-Label Update**."
          } >> "$GITHUB_STEP_SUMMARY"
