# Creates a client's app in Google Play and gets its first release out.
#
# This is the half of publishing that cannot be automated through the API:
# Google refuses the *first* artifact of a new app over the Play Developer API,
# so a brand-new client has to go through the console once. That is done by
# driving a real browser on a self-hosted runner against a signed-in Google
# session — which is why this is its own workflow rather than more jobs beside
# the build. It needs a machine the build does not, and it can block for half an
# hour waiting for someone to sign in.
#
# After this has run once for a client, that package is published and
# release-white-label-update.yml takes over for everything afterwards.
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY        = FlavorFlow project API key
#   Variable PLAY_DEVELOPER_ID   = Play developer id
#   Variable PLAY_TESTER_EMAILS  = optional, comma-separated
name: Create Play App

on:
  # Called by build-white-label.yml when the gate says Play has never seen this
  # package. workflow_call inputs are not subject to the ten-input dispatch cap.
  workflow_call:
    inputs:
      project_id:            { type: string,  required: false, default: '' }
      client_id:             { type: string,  required: false, default: '' }
      client_name:           { type: string,  required: false, default: '' }
      app_name:              { type: string,  required: false, default: '' }
      package_name:          { type: string,  required: false, default: '' }
      play_app_id:           { type: string,  required: false, default: '' }
      force_create:          { type: string,  required: false, default: 'false' }
      countries:             { type: string,  required: false, default: '' }
      publish_to_production: { type: boolean, required: false, default: false }

  workflow_dispatch:
    inputs:
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      client_id:
        description: 'FlavorFlow client id to create the app for'
        required: false
        default: ''
      client_name:
        description: 'Client name (labels the run)'
        required: false
        default: ''
      app_name:
        description: 'App name'
        required: false
        default: ''
      package_name:
        description: 'Package name (labels the run; the action reads the real one from FlavorFlow)'
        required: false
        default: ''
      play_app_id:
        description: >-
          Existing Play app id. Set it to resume against an app a previous run
          created, so creation is skipped instead of failing on the name.
        required: false
        default: ''
      force_create:
        description: >-
          Create a new Play app even if one is remembered. Needed when the
          existing app has the wrong package name, which Play will not change.
        required: false
        default: 'false'
      countries:
        description: >-
          Countries for a production release, as Play spells them, comma
          separated. Blank means every country. Only read when publishing.
        required: false
        default: ''
      publish_to_production:
        description: >-
          Also promote this first release to production. Off by default: it is
          public and it is not reversible.
        type: boolean
        required: false
        default: false

jobs:
  create:
    name: First release for '${{ inputs.client_name }}' (console)
    if: inputs.client_id != ''
    # A real desktop browser against a signed-in Google session, which a
    # GitHub-hosted runner can be neither of.
    runs-on: [self-hosted, macOS]
    outputs:
      app_id: ${{ steps.play.outputs.app-id }}
      created: ${{ steps.play.outputs.created }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Locate the bundle
        id: aab
        run: |
          set -euo pipefail
          aab=$(find bundle -name '*.aab' | head -1)
          if [ -z "$aab" ]; then
            echo "::error::No .aab was produced — the build skips the bundle when signing secrets are missing."
            exit 1
          fi
          echo "path=$(cd "$(dirname "$aab")" && pwd)/$(basename "$aab")" >> "$GITHUB_OUTPUT"
          ls -lh "$aab"

      - name: Create the app and fill its forms
        id: play
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          # "all" is filtered by the project's saved answers, so a form the
          # project has no answers for simply does not run.
          form: all
          developer-id: ${{ vars.PLAY_DEVELOPER_ID }}
          app-id: ${{ inputs.play_app_id }}
          force-create: ${{ inputs.force_create }}

      - name: Publish to internal testing
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          form: internal_testing_form
          developer-id: ${{ vars.PLAY_DEVELOPER_ID }}
          app-id: ${{ steps.play.outputs.app-id || inputs.play_app_id }}
          # Promotion belongs to the action, which owns the console session and
          # runs it in the same browser as the release it promotes.
          publish-to-production: ${{ inputs.publish_to_production }}
          countries: ${{ inputs.countries }}
          # Testers are optional — Play takes the release without them and lets
          # you add them later, so an unset PLAY_TESTER_EMAILS skips that half.
          form-params: |
            listName=${{ vars.PLAY_TESTER_EMAILS && (vars.PLAY_TESTER_LIST_NAME || 'Internal testers') || '' }}
            emails=${{ vars.PLAY_TESTER_EMAILS }}
            aab=${{ steps.aab.outputs.path }}

      - name: Report
        run: |
          {
            echo "### First release (console)"
            echo "- App id: \`${{ steps.play.outputs.app-id }}\`"
            echo "- Created this run: ${{ steps.play.outputs.created }}"
            echo ""
            echo "This package is now published, so every later run goes through"
            echo "**Release White-Label Update** instead."
          } >> "$GITHUB_STEP_SUMMARY"
