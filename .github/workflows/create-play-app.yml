# Brings a brand-new client into Google Play: builds it, creates the app,
# fills every form, and gets its first release out to internal testing.
#
# This is the entry point FlavorFlow dispatches `client.added` to, and the half
# of publishing that cannot go through the API — Google refuses the first
# artifact of a new app, so the first release drives a real browser on a
# self-hosted runner against a signed-in Google session. It can block waiting
# for someone to sign in, which is why it is separate from the build it calls.
#
# Once this has run for a client, that package is published and
# release-white-label-update.yml handles every release after it.
#
# The developer account is read off the signed-in session and remembered, so
# there is nothing to configure for it. Tester lists, categories and every
# other answer come from the project's saved answers, edited in the FlavorFlow
# app rather than here.
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = FlavorFlow project id
name: Create Play App

on:
  # FlavorFlow dispatches this when a client is added to the bound project.
  # Every input it sends must be declared or GitHub rejects the dispatch with
  # 422 "Unexpected inputs provided", so these eight mirror workflowInputs() in
  # the FlavorFlow backend exactly. All are optional so a plain "Run workflow"
  # still works.
  #
  # Ten is the hard cap on dispatch inputs, and these ten use it up. Anything
  # further belongs to release-white-label-update.yml, which has its own.
  workflow_dispatch:
    inputs:
      event:
        description: 'FlavorFlow event name (e.g. client.added)'
        required: false
        default: ''
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      project_name:
        description: 'FlavorFlow project name'
        required: false
        default: ''
      client_id:
        description: 'Client id — the client to create an app for'
        required: false
        default: ''
      client_name:
        description: 'Client name'
        required: false
        default: ''
      app_name:
        description: 'App name for the client'
        required: false
        default: ''
      package_name:
        description: 'Application id / package name for the client'
        required: false
        default: ''
      payload:
        description: 'Full event as JSON'
        required: false
        default: ''
      publish_to_production:
        description: >-
          Also promote this first release to production. Off by default: it is
          public and it is not reversible. The countries it ships to come from
          the project's saved answers, not from here.
        type: boolean
        required: false
        default: false
      play_app_id:
        description: >-
          Existing Play app id. Set it to resume against an app a previous run
          created, so creation is skipped instead of failing on the name.
        required: false
        default: ''

jobs:
  # The same build every other path uses, called rather than duplicated.
  build:
    name: Build
    if: inputs.client_id != ''
    uses: ./.github/workflows/build-white-label.yml
    with:
      client_id: ${{ inputs.client_id }}
      client_name: ${{ inputs.client_name }}
    secrets: inherit

  create:
    name: First release for '${{ inputs.client_name }}' (console)
    needs: build
    if: inputs.client_id != ''
    # A real desktop browser against a signed-in Google session, which a
    # GitHub-hosted runner can be neither of.
    runs-on: [self-hosted, macOS]
    outputs:
      app_id: ${{ steps.play.outputs.app-id }}
      created: ${{ steps.play.outputs.created }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      # The build renders these from the client's own UI, but nothing passed
      # them to the listing form — so the text filled and the icon, feature
      # graphic and screenshots stayed empty, which Play reports as "Upload an
      # icon" and refuses to publish a listing without.
      - name: Download the listing assets
        uses: actions/download-artifact@v7
        with:
          pattern: listing-*
          merge-multiple: true
          path: listing

      - name: Locate the bundle and the listing assets
        id: aab
        run: |
          set -euo pipefail
          aab=$(find bundle -name '*.aab' | head -1)
          if [ -z "$aab" ]; then
            echo "::error::No .aab was produced — the build skips the bundle when signing secrets are missing."
            exit 1
          fi
          echo "path=$(cd "$(dirname "$aab")" && pwd)/$(basename "$aab")" >> "$GITHUB_OUTPUT"
          ls -lh "$aab"

          # Absolute paths: the runner reads these from disk while driving the
          # console, from whatever directory it happens to be in.
          root=$(cd listing 2>/dev/null && pwd || true)
          abs() { if [ -n "$root" ] && [ -f "$root/$1" ]; then echo "$root/$1"; fi; }
          echo "icon=$(abs en-US/images/icon.png)" >> "$GITHUB_OUTPUT"
          echo "feature=$(abs en-US/images/feature_graphic.png)" >> "$GITHUB_OUTPUT"
          shots=$(find "${root:-/nonexistent}" -path '*phoneScreenshots*' -name '*.png' 2>/dev/null | sort | paste -sd, - || true)
          echo "shots=$shots" >> "$GITHUB_OUTPUT"
          # Said out loud: Play will not publish a listing without these, and
          # the form reports it as a page error rather than a failed step.
          [ -n "$(abs en-US/images/icon.png)" ] || echo "::warning::No icon asset — the store listing cannot be completed."
          [ -n "$shots" ] || echo "::warning::No phone screenshots — Play requires at least two."

      - name: Create the app and fill its forms
        id: play
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          # "all" is filtered by the project's saved answers, so a form the
          # project has no answers for simply does not run.
          form: all
          # The listing assets are facts about this build, so they travel as
          # params rather than living in the project's saved answers.
          form-params: |
            app_icon=${{ steps.aab.outputs.icon }}
            feature_graphic=${{ steps.aab.outputs.feature }}
            phone_screenshots=${{ steps.aab.outputs.shots }}
          app-id: ${{ inputs.play_app_id }}

      - name: Publish to internal testing
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          form: internal_testing_form
          app-id: ${{ steps.play.outputs.app-id || inputs.play_app_id }}
          # Promotion belongs to the action, which owns the console session and
          # runs it in the same browser as the release it promotes. `countries`
          # is deliberately not passed: the form reads it from the project's
          # saved answers, so it is set once in the app rather than per run.
          publish-to-production: ${{ inputs.publish_to_production }}
          # Only the bundle path, which is a fact about this run. Everything
          # else the form needs — the tester list name and emails included —
          # comes from the project's saved answers, so it is edited in one
          # place and a client can override it.
          form-params: |
            aab=${{ steps.aab.outputs.path }}

      - name: Report
        run: |
          {
            echo "### First release (console)"
            echo "- App id: \`${{ steps.play.outputs.app-id }}\`"
            echo "- Created this run: ${{ steps.play.outputs.created }}"
            echo ""
            echo "This package is now published, so every later run goes through"
            echo "**Release White-Label Update** instead."
          } >> "$GITHUB_STEP_SUMMARY"
