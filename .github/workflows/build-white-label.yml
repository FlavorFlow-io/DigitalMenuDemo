# Builds one branded APK and signed bundle per FlavorFlow client from this
# single codebase.
#
# 1. fetch-flavors-action  → pulls every client from your FlavorFlow project
# 2. apply-flavor-action   → rewrites theme (Color.kt/Theme.kt), app_name,
#                            applicationId and launcher icon for that client
# 3. ./gradlew             → APK, signed .aab, store screenshots and icon,
#                            all uploaded as run artifacts
#
# This is the shared half of the pipeline: create-play-app.yml and
# release-white-label-update.yml both call it and then publish what it built.
# Run it on its own to build without publishing anything.
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = your FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = your FlavorFlow project id
name: White-Label Build

on:
  # Called by whichever workflow is going to publish the result. Its inputs are
  # only what narrows the build; the publishing details belong to the caller.
  workflow_call:
    inputs:
      client_id:
        description: 'Build only this client. Blank builds every client in the project.'
        type: string
        required: false
        default: ''
      client_name:
        type: string
        required: false
        default: ''

  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      client_id:
        description: 'Build only this client. Blank builds every client.'
        required: false
        default: ''

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.select.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@v1
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

      # A client.added event concerns exactly one client, so building all of
      # them would waste most of the run. `config` is the client JSON as a
      # string and its `id` is the same id FlavorFlow sends as client_id.
      - name: Select clients to build
        id: select
        env:
          ALL_FLAVORS: ${{ steps.fetch-flavors-action.outputs.flavors }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "Building every client in the project."
            selected="$ALL_FLAVORS"
          else
            selected=$(jq -c --arg id "$CLIENT_ID" \
              '[.[] | select((.config | fromjson).id == $id)]' <<< "$ALL_FLAVORS")
            count=$(jq 'length' <<< "$selected")
            if [ "$count" -eq 0 ]; then
              # Also the normal path for FlavorFlow's "send test event" button,
              # whose synthetic client never matches a real one.
              echo "::warning::No client matches id '$CLIENT_ID' — nothing to build. \
          The dispatch itself succeeded; this is expected for a test event or a disabled client."
            else
              echo "Building only client '$CLIENT_ID'."
            fi
          fi
          echo "flavors=$selected" >> "$GITHUB_OUTPUT"

      - name: Summarise what is being built
        env:
          CLIENT_NAME: ${{ inputs.client_name }}
          CLIENT_ID: ${{ inputs.client_id }}
          SELECTED: ${{ steps.select.outputs.flavors }}
        run: |
          {
            echo "### White-label build"
            if [ -n "$CLIENT_ID" ]; then
              echo "- Client: ${CLIENT_NAME:-$CLIENT_ID}"
            else
              echo "- Every client in the project"
            fi
            echo "- Clients to build: $(jq 'length' <<< "$SELECTED")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Asks Play whether the API will accept an upload for this package. The same
  # question fastlane would hit on its first call, asked cheaply and without
  # publishing anything: an edit is opened and immediately deleted.
  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    # An empty matrix is a hard error, so skip the job when the filter above
    # selected nothing rather than failing the run.
    if: needs.fetch-flavors.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      # apply-flavor-action rewrites the app's package, but it only knows about
      # the main source set — so the screenshot sources kept declaring and
      # importing io.flavorflow.demo and stopped compiling for every client
      # whose package differs. Follow the namespace it actually left behind.
      - name: Point the screenshot sources at this client's package
        run: |
          set -euo pipefail
          ns=$(grep -oE 'namespace = "[^"]+"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          old=io.flavorflow.demo
          src=app/src/screenshots/kotlin
          if [ -z "$ns" ] || [ "$ns" = "$old" ]; then
            echo "Package unchanged ($ns) — screenshot sources left alone."
            exit 0
          fi
          dest="$src/$(echo "$ns" | tr . /)"
          mkdir -p "$dest"
          find "$src/$(echo "$old" | tr . /)" -name '*.kt' -exec mv {} "$dest/" \;
          # Rewrite package, imports and anything else naming the old package,
          # including the R class the namespace change moved. perl rather than
          # sed -i, which differs between GNU and BSD and so cannot be checked
          # anywhere but the runner; \Q quotes the dots, \b keeps a longer
          # package that merely starts with this one intact.
          find "$dest" -name '*.kt' -exec perl -pi -e "s/\Q$old\E\b/$ns/g" {} +
          rm -rf "${src:?}/io"
          echo "Screenshot sources moved to $ns"

      # After apply-flavor-action, so the images carry this client's branding:
      # they are rendered from the app's own composables under its own theme.
      - name: Generate store screenshots
        run: ./gradlew :app:storeScreenshots --stacktrace

      # Play's listing icon is 512x512 and the launcher densities top out at
      # 192, so it is generated from the same logo apply-flavor-action already
      # downloaded rather than upscaled from a mipmap.
      - name: Generate the store icon from the client logo
        run: |
          set -euo pipefail
          # `|| true`, and the directory test, because pipefail makes a failing
          # find abort the assignment itself — so the "no logo" branch below was
          # unreachable and a client without a logo failed the build instead of
          # warning. Which is what happened to two of them.
          logo=""
          if [ -d assets/logos ]; then
            logo=$(find assets/logos -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) 2>/dev/null | head -1 || true)
          fi
          if [ -z "$logo" ]; then
            echo "::warning::No logo for this client — its store listing will have no icon, which Play requires before a listing can be published."
            exit 0
          fi
          # java rather than ImageMagick: `convert` is not on the runner image
          # any more, and this exited 127 on every leg for two days.
          java tools/MakeIcon.java "$logo" app/screenshots/en-US/images/icon.png

      - name: Upload store screenshots
        uses: actions/upload-artifact@v7
        with:
          name: listing-${{ matrix.name }}
          path: app/screenshots/**/*.png
          if-no-files-found: error

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'

      # Signing secrets are absent in forks, where the debug APK above is still
      # worth having — so the release bundle is skipped rather than failing.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets — skipping the release bundle."
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the workspace so it cannot be picked up by an artifact glob.
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Play rejects a versionCode it has already seen, and refuses a
          # release whose code is lower than one already uploaded.
          #
          # run_number counts per workflow, not per repo, and inside a reusable
          # workflow it is the caller's. A build from Create Play App (run 1)
          # therefore produced versionCode 1 while the app already had codes in
          # the forties from White-Label Build, and Play rejected the release as
          # "completely shadowed by one or more APKs with higher version codes".
          # Re-running a run does not change run_number either, so a retry
          # collided with the build it was retrying.
          #
          # Seconds since 2020 rises whichever workflow builds, differs on every
          # re-run, and stays inside Play's 2,100,000,000 ceiling until ~2086.
          # run_number.run_attempt goes in the version name, where it is for
          # people to read rather than for Play to order by.
          version_code=$(( $(date -u +%s) - 1577836800 ))
          version_name="1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "versionCode=$version_code  versionName=$version_name"
          ./gradlew bundleRelease --stacktrace \
            -PversionCode="$version_code" \
            -PversionName="$version_name"

      - name: Verify the bundle is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Must be the packaged output, not intermediates/: the intermediary
          # bundle is the pre-signing artifact and never carries a signature.
          aab=$(find . -path '*/outputs/bundle/release/*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No .aab in outputs/bundle/release"; exit 1; }
          # An unsigned bundle still builds, so assert the signature block
          # rather than trusting a green build.
          if ! unzip -l "$aab" | grep -qiE 'META-INF/.*\.RSA'; then
            echo "::error::$aab has no signature block — it built unsigned."
            exit 1
          fi
          echo "Signed: $aab"
          jarsigner -verify "$aab" | head -1

      - name: Upload release bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}.aab
          path: '**/outputs/bundle/release/*.aab'

      - name: Remove the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
