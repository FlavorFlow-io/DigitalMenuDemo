# Builds one branded APK per FlavorFlow client from this single codebase.
#
# 1. fetch-flavors-action  → pulls every client from your FlavorFlow project
# 2. apply-flavor-action   → rewrites theme (Color.kt/Theme.kt), app_name,
#                            applicationId and launcher icon for that client
# 3. ./gradlew assembleDebug → builds the APK, uploaded as a run artifact
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = your FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = your FlavorFlow project id
name: White-Label Build

on:
  push:
    branches: [ main ]

  # FlavorFlow dispatches this workflow when a client is added to the bound
  # project. Every input it sends must be declared here or GitHub rejects the
  # dispatch with 422 "Unexpected inputs provided" — so these eight mirror
  # workflowInputs() in the FlavorFlow backend exactly. All are optional so a
  # plain "Run workflow" (and the push trigger above) still works, in which
  # case they arrive empty and every client is built.
  workflow_dispatch:
    inputs:
      event:
        description: 'FlavorFlow event name (e.g. client.added)'
        required: false
        default: ''
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      project_name:
        description: 'FlavorFlow project name'
        required: false
        default: ''
      client_id:
        description: 'Client id — when set, only this client is built'
        required: false
        default: ''
      client_name:
        description: 'Client name'
        required: false
        default: ''
      app_name:
        description: 'App name for the client'
        required: false
        default: ''
      package_name:
        description: 'Application id / package name for the client'
        required: false
        default: ''
      payload:
        description: 'Full event as JSON'
        required: false
        default: ''

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.select.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@v1
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

      # A client.added event concerns exactly one client, so building all of
      # them would waste most of the run. `config` is the client JSON as a
      # string and its `id` is the same id FlavorFlow sends as client_id.
      - name: Select clients to build
        id: select
        env:
          ALL_FLAVORS: ${{ steps.fetch-flavors-action.outputs.flavors }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "Building every client in the project."
            selected="$ALL_FLAVORS"
          else
            selected=$(jq -c --arg id "$CLIENT_ID" \
              '[.[] | select((.config | fromjson).id == $id)]' <<< "$ALL_FLAVORS")
            count=$(jq 'length' <<< "$selected")
            if [ "$count" -eq 0 ]; then
              # Also the normal path for FlavorFlow's "send test event" button,
              # whose synthetic client never matches a real one.
              echo "::warning::No client matches id '$CLIENT_ID' — nothing to build. \
          The dispatch itself succeeded; this is expected for a test event or a disabled client."
            else
              echo "Building only client '$CLIENT_ID'."
            fi
          fi
          echo "flavors=$selected" >> "$GITHUB_OUTPUT"

      - name: Summarise trigger
        env:
          EVENT: ${{ inputs.event }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CLIENT_NAME: ${{ inputs.client_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SELECTED: ${{ steps.select.outputs.flavors }}
        run: |
          {
            echo "### White-label build"
            if [ -n "$EVENT" ]; then
              echo "- Triggered by \`$EVENT\` from FlavorFlow"
              echo "- Project: ${PROJECT_NAME:-—}"
              echo "- Client: ${CLIENT_NAME:-—} (\`${PACKAGE_NAME:-—}\`)"
            else
              echo "- Triggered manually or by push — building every client"
            fi
            echo "- Clients to build: $(jq 'length' <<< "$SELECTED")"
          } >> "$GITHUB_STEP_SUMMARY"

  # A real client.added carries a client_id; push and manual runs do not, and
  # there is no single client to create an app for in that case.
  #
  # Deliberately not a dependency of build-flavors: creating the Play app can
  # block for up to 30 minutes waiting for someone to sign in on the runner, and
  # the APKs are useful regardless of whether that happened.
  create-play-app:
    name: Create Play app for '${{ inputs.client_name }}'
    if: inputs.client_id != ''
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5

      - name: Create the app in Play Console
        id: play
        uses: FlavorFlow-io/google-play-automation/actions/create-play-app@dynamic-form
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}

      - name: Report
        run: |
          echo "app-id=${{ steps.play.outputs.app-id }}"
          echo "created=${{ steps.play.outputs.created }}"

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    # An empty matrix is a hard error, so skip the job when the filter above
    # selected nothing rather than failing the run.
    if: needs.fetch-flavors.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'
