# Builds a branded APK, signed bundle and store images for each FlavorFlow
# client. create-play-app.yml and release-white-label-update.yml call it
# before publishing; run it alone to build without publishing.
#
# Needs the secret TEST_API_KEY and the variable TEST_PROJECT_ID.
name: White-Label Build

on:
  workflow_call:
    inputs:
      client_id:
        description: 'Build only this client. Blank builds every client in the project.'
        type: string
        required: false
        default: ''
    outputs:
      client_name:
        description: "The client's name as saved in FlavorFlow"
        value: ${{ jobs.fetch-flavors.outputs.client_name }}

  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      client_id:
        description: 'Build only this client. Blank builds every client.'
        required: false
        default: ''

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.fetch.outputs.flavors }}
      client_name: ${{ steps.fetch.outputs.client-name }}
    steps:
      - name: Fetch the clients to build
        id: fetch
        uses: FlavorFlow-io/fetch-flavors-action@v1.1.0
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}
          client-id: ${{ inputs.client_id }}

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    # An empty matrix is an error, so skip when no client was selected.
    if: needs.fetch-flavors.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      # Also exports the client's assets, e.g. $MENU_JSON for its menu.
      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1.1.0
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: '21'
          token: ${{ github.token }} # avoids the anonymous API rate limit

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Generate store screenshots
        run: ./gradlew :app:storeScreenshots --stacktrace

      # Play needs a 512x512 icon, larger than any launcher icon.
      - name: Generate the store icon from the client logo
        run: |
          set -euo pipefail
          logo=""
          if [ -d assets/logos ]; then
            logo=$(find assets/logos -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) 2>/dev/null | head -1 || true)
          fi
          if [ -z "$logo" ]; then
            echo "::warning::No logo for this client — its store listing will have no icon, which Play requires before a listing can be published."
            exit 0
          fi
          java tools/MakeIcon.java "$logo" app/screenshots/en-US/images/icon.png

      - name: Upload store screenshots
        uses: actions/upload-artifact@v7
        with:
          name: listing-${{ matrix.name }}
          path: app/screenshots/**/*.png
          if-no-files-found: error

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'

      # Without signing secrets (e.g. in forks) only the debug APK is built.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets — skipping the release bundle."
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        id: bundle
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Play only accepts increasing version codes. Minutes since 2026,
          # times ten, plus the run attempt: always higher, even on a re-run.
          attempt=${{ github.run_attempt }}
          [ "$attempt" -gt 9 ] && attempt=9
          version_code=$(( ($(date -u +%s) - 1767225600) / 60 * 10 + attempt ))
          version_name="1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "versionCode=$version_code  versionName=$version_name"
          {
            echo "version_code=$version_code"
            echo "version_name=$version_name"
          } >> "$GITHUB_OUTPUT"
          ./gradlew bundleRelease --stacktrace \
            -PversionCode="$version_code" \
            -PversionName="$version_name"

      # Read by create-play-app.yml to save the released version in FlavorFlow.
      - name: Record what this bundle is
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          dir=$(dirname "$(find . -path '*/outputs/bundle/release/*.aab' | head -1)")
          jq -n \
            --arg name "${{ steps.bundle.outputs.version_name }}" \
            --argjson code "${{ steps.bundle.outputs.version_code }}" \
            '{version_name: $name, version_code: $code}' > "$dir/release-info.json"
          cat "$dir/release-info.json"

      - name: Upload release bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}.aab
          path: |
            **/outputs/bundle/release/*.aab
            **/outputs/bundle/release/release-info.json

      - name: Remove the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
