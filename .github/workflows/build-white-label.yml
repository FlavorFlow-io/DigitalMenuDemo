# Builds one branded APK per FlavorFlow client from this single codebase.
#
# 1. fetch-flavors-action  → pulls every client from your FlavorFlow project
# 2. apply-flavor-action   → rewrites theme (Color.kt/Theme.kt), app_name,
#                            applicationId and launcher icon for that client
# 3. ./gradlew assembleDebug → builds the APK, uploaded as a run artifact
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = your FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = your FlavorFlow project id
name: White-Label Build

on:
  push:
    branches: [ main ]

  # FlavorFlow dispatches this workflow when a client is added to the bound
  # project. Every input it sends must be declared here or GitHub rejects the
  # dispatch with 422 "Unexpected inputs provided" — so these eight mirror
  # workflowInputs() in the FlavorFlow backend exactly. All are optional so a
  # plain "Run workflow" (and the push trigger above) still works, in which
  # case they arrive empty and every client is built.
  workflow_dispatch:
    inputs:
      event:
        description: 'FlavorFlow event name (e.g. client.added)'
        required: false
        default: ''
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      project_name:
        description: 'FlavorFlow project name'
        required: false
        default: ''
      client_id:
        description: 'Client id — when set, only this client is built'
        required: false
        default: ''
      client_name:
        description: 'Client name'
        required: false
        default: ''
      app_name:
        description: 'App name for the client'
        required: false
        default: ''
      package_name:
        description: 'Application id / package name for the client'
        required: false
        default: ''
      payload:
        description: 'Full event as JSON'
        required: false
        default: ''
      force_create:
        description: >-
          Create a new Play app even if one is remembered. Needed when the
          existing app has the wrong package name, which Play will not change.
        required: false
        default: 'false'
      play_app_id:
        description: >-
          Existing Play app id. Set it to resume against an app a previous run
          created, so creation is skipped instead of failing on the name.
        required: false
        default: ''

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.select.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@v1
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

      # A client.added event concerns exactly one client, so building all of
      # them would waste most of the run. `config` is the client JSON as a
      # string and its `id` is the same id FlavorFlow sends as client_id.
      - name: Select clients to build
        id: select
        env:
          ALL_FLAVORS: ${{ steps.fetch-flavors-action.outputs.flavors }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "Building every client in the project."
            selected="$ALL_FLAVORS"
          else
            selected=$(jq -c --arg id "$CLIENT_ID" \
              '[.[] | select((.config | fromjson).id == $id)]' <<< "$ALL_FLAVORS")
            count=$(jq 'length' <<< "$selected")
            if [ "$count" -eq 0 ]; then
              # Also the normal path for FlavorFlow's "send test event" button,
              # whose synthetic client never matches a real one.
              echo "::warning::No client matches id '$CLIENT_ID' — nothing to build. \
          The dispatch itself succeeded; this is expected for a test event or a disabled client."
            else
              echo "Building only client '$CLIENT_ID'."
            fi
          fi
          echo "flavors=$selected" >> "$GITHUB_OUTPUT"

      - name: Summarise trigger
        env:
          EVENT: ${{ inputs.event }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CLIENT_NAME: ${{ inputs.client_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SELECTED: ${{ steps.select.outputs.flavors }}
        run: |
          {
            echo "### White-label build"
            if [ -n "$EVENT" ]; then
              echo "- Triggered by \`$EVENT\` from FlavorFlow"
              echo "- Project: ${PROJECT_NAME:-—}"
              echo "- Client: ${CLIENT_NAME:-—} (\`${PACKAGE_NAME:-—}\`)"
            else
              echo "- Triggered manually or by push — building every client"
            fi
            echo "- Clients to build: $(jq 'length' <<< "$SELECTED")"
          } >> "$GITHUB_STEP_SUMMARY"

  # A real client.added carries a client_id; push and manual runs do not, and
  # there is no single client to create an app for in that case.
  #
  # Deliberately not a dependency of build-flavors: creating the Play app can
  # block for up to 30 minutes waiting for someone to sign in on the runner, and
  # the APKs are useful regardless of whether that happened.
  create-play-app:
    name: Create Play app for '${{ inputs.client_name }}'
    if: inputs.client_id != ''
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5

      - name: Create the app in Play Console
        id: play
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          # "all" creates the app and fills every form the project's saved
          # answers cover, in one browser session.
          form: all
          # Without this the run stops on Play's developer-account chooser.
          developer-id: ${{ vars.PLAY_DEVELOPER_ID }}
          app-id: ${{ inputs.play_app_id }}
          force-create: ${{ inputs.force_create }}

      - name: Report
        run: |
          echo "app-id=${{ steps.play.outputs.app-id }}"
          echo "created=${{ steps.play.outputs.created }}"

  # Separate from create-play-app because the two wait on different things:
  # creating the app needs nobody but the console, while uploading a bundle
  # needs the build to have finished. Keeping them apart means a 30-minute
  # sign-in wait during creation does not also stall the build.
  release-to-internal:
    name: Internal release for '${{ inputs.client_name }}'
    if: inputs.client_id != ''
    needs: [create-play-app, build-flavors]
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v5

      - name: Download the signed bundle
        uses: actions/download-artifact@v7
        with:
          # By name would couple this to how fetch-flavors labels a client; the
          # matrix is filtered to one client here, so there is exactly one.
          pattern: bundle-*
          merge-multiple: true
          path: bundle

      - name: Locate the bundle
        id: aab
        run: |
          set -euo pipefail
          aab=$(find bundle -name '*.aab' | head -1)
          if [ -z "$aab" ]; then
            echo "::error::No .aab was produced — the build job skips the bundle when signing secrets are missing."
            exit 1
          fi
          count=$(find bundle -name '*.aab' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || echo "::warning::$count bundles found; using $aab"
          echo "path=$(cd "$(dirname "$aab")" && pwd)/$(basename "$aab")" >> "$GITHUB_OUTPUT"
          ls -lh "$aab"

      - name: Upload to internal testing
        uses: FlavorFlow-io/create-play-app-action@main
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ inputs.project_id }}
          client-id: ${{ inputs.client_id }}
          app-name: ${{ inputs.app_name }}
          # Creating is idempotent — it reports the existing app id — so this
          # invocation resolves the app the previous job created, then fills the
          # release form against it.
          form: internal_testing_form
          developer-id: ${{ vars.PLAY_DEVELOPER_ID }}
          # This job runs separately from the one that created the app, so the
          # id has to travel with it rather than being assumed.
          app-id: ${{ inputs.play_app_id }}
          # Testers are optional: Play takes the release now and lets you add
          # them afterwards. Set PLAY_TESTER_EMAILS to have the run create the
          # list too; leave it unset and the form skips that half.
          form-params: |
            listName=${{ vars.PLAY_TESTER_EMAILS && (vars.PLAY_TESTER_LIST_NAME || 'Internal testers') || '' }}
            emails=${{ vars.PLAY_TESTER_EMAILS }}
            aab=${{ steps.aab.outputs.path }}

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    # An empty matrix is a hard error, so skip the job when the filter above
    # selected nothing rather than failing the run.
    if: needs.fetch-flavors.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'

      # Signing secrets are absent in forks, where the debug APK above is still
      # worth having — so the release bundle is skipped rather than failing.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets — skipping the release bundle."
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the workspace so it cannot be picked up by an artifact glob.
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Play rejects a versionCode it has already seen. run_number is
          # monotonic per repo, which is enough while every client starts at
          # zero uploads; a client with existing releases needs its own counter.
          ./gradlew bundleRelease --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Verify the bundle is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Must be the packaged output, not intermediates/: the intermediary
          # bundle is the pre-signing artifact and never carries a signature.
          aab=$(find . -path '*/outputs/bundle/release/*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No .aab in outputs/bundle/release"; exit 1; }
          # An unsigned bundle still builds, so assert the signature block
          # rather than trusting a green build.
          if ! unzip -l "$aab" | grep -qiE 'META-INF/.*\.RSA'; then
            echo "::error::$aab has no signature block — it built unsigned."
            exit 1
          fi
          echo "Signed: $aab"
          jarsigner -verify "$aab" | head -1

      - name: Upload release bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}.aab
          path: '**/outputs/bundle/release/*.aab'

      - name: Remove the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
