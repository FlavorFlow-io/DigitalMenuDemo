# Builds one branded APK per FlavorFlow client from this single codebase.
#
# 1. fetch-flavors-action  → pulls every client from your FlavorFlow project
# 2. apply-flavor-action   → rewrites theme (Color.kt/Theme.kt), app_name,
#                            applicationId and launcher icon for that client
# 3. ./gradlew assembleDebug → builds the APK, uploaded as a run artifact
# 4. create-play-app.yml      → for a client Play has never seen: creates the
#                               app through the console and gets its first
#                               release out
#    release-white-label-      → for one it has: uploads through the Play API,
#    update.yml                  no browser involved
#
# Which of the two runs is decided by asking Play, not by asking you.
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = your FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = your FlavorFlow project id
name: White-Label Build

on:
  push:
    branches: [ main ]

  # FlavorFlow dispatches this workflow when a client is added to the bound
  # project. Every input it sends must be declared here or GitHub rejects the
  # dispatch with 422 "Unexpected inputs provided" — so these eight mirror
  # workflowInputs() in the FlavorFlow backend exactly. All are optional so a
  # plain "Run workflow" (and the push trigger above) still works, in which
  # case they arrive empty and every client is built.
  workflow_dispatch:
    inputs:
      event:
        description: 'FlavorFlow event name (e.g. client.added)'
        required: false
        default: ''
      project_id:
        description: 'FlavorFlow project id'
        required: false
        default: ''
      project_name:
        description: 'FlavorFlow project name'
        required: false
        default: ''
      client_id:
        description: 'Client id — when set, only this client is built'
        required: false
        default: ''
      client_name:
        description: 'Client name'
        required: false
        default: ''
      app_name:
        description: 'App name for the client'
        required: false
        default: ''
      package_name:
        description: 'Application id / package name for the client'
        required: false
        default: ''
      payload:
        description: 'Full event as JSON'
        required: false
        default: ''
      force_create:
        description: >-
          Create a new Play app even if one is remembered. Needed when the
          existing app has the wrong package name, which Play will not change.
        required: false
        default: 'false'
      play_app_id:
        description: >-
          Existing Play app id. Set it to resume against an app a previous run
          created, so creation is skipped instead of failing on the name.
        required: false
        default: ''

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.select.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@v1
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

      # A client.added event concerns exactly one client, so building all of
      # them would waste most of the run. `config` is the client JSON as a
      # string and its `id` is the same id FlavorFlow sends as client_id.
      - name: Select clients to build
        id: select
        env:
          ALL_FLAVORS: ${{ steps.fetch-flavors-action.outputs.flavors }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ]; then
            echo "Building every client in the project."
            selected="$ALL_FLAVORS"
          else
            selected=$(jq -c --arg id "$CLIENT_ID" \
              '[.[] | select((.config | fromjson).id == $id)]' <<< "$ALL_FLAVORS")
            count=$(jq 'length' <<< "$selected")
            if [ "$count" -eq 0 ]; then
              # Also the normal path for FlavorFlow's "send test event" button,
              # whose synthetic client never matches a real one.
              echo "::warning::No client matches id '$CLIENT_ID' — nothing to build. \
          The dispatch itself succeeded; this is expected for a test event or a disabled client."
            else
              echo "Building only client '$CLIENT_ID'."
            fi
          fi
          echo "flavors=$selected" >> "$GITHUB_OUTPUT"

      - name: Summarise trigger
        env:
          EVENT: ${{ inputs.event }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CLIENT_NAME: ${{ inputs.client_name }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          SELECTED: ${{ steps.select.outputs.flavors }}
        run: |
          {
            echo "### White-label build"
            if [ -n "$EVENT" ]; then
              echo "- Triggered by \`$EVENT\` from FlavorFlow"
              echo "- Project: ${PROJECT_NAME:-—}"
              echo "- Client: ${CLIENT_NAME:-—} (\`${PACKAGE_NAME:-—}\`)"
            else
              echo "- Triggered manually or by push — building every client"
            fi
            echo "- Clients to build: $(jq 'length' <<< "$SELECTED")"
          } >> "$GITHUB_STEP_SUMMARY"

  # Asks Play whether the API will accept an upload for this package. The same
  # question fastlane would hit on its first call, asked cheaply and without
  # publishing anything: an edit is opened and immediately deleted.
  gate:
    name: Can the API publish this package?
    runs-on: ubuntu-latest
    if: inputs.client_id != ''
    outputs:
      api_ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Probe the Play Developer API
        id: check
        env:
          KEY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ inputs.package_name }}
        run: |
          set -euo pipefail
          # No key or no package name is not a failure: it just means this run
          # takes the console path, which needs neither.
          if [ -z "$KEY_JSON" ]; then
            echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON — taking the console path."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$PACKAGE" ]; then
            echo "::notice::No package name supplied — taking the console path."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          key="$RUNNER_TEMP/play-key.json"
          printf '%s' "$KEY_JSON" > "$key"; chmod 600 "$key"
          # A throwaway gcloud config, so this never disturbs anything else on
          # the runner.
          export CLOUDSDK_CONFIG="$RUNNER_TEMP/gcloud"
          gcloud auth activate-service-account --key-file="$key" --quiet >/dev/null 2>&1 || {
            echo "::warning::The service-account key was rejected — taking the console path."
            rm -f "$key"; echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }
          token=$(gcloud auth print-access-token \
            --scopes=https://www.googleapis.com/auth/androidpublisher 2>/dev/null || true)
          rm -f "$key"
          [ -n "$token" ] || { echo "::warning::Could not mint a token — console path."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0; }

          api=https://androidpublisher.googleapis.com/androidpublisher/v3
          body="$RUNNER_TEMP/edit.json"
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Length: 0' \
            "$api/applications/$PACKAGE/edits")
          case "$status" in
            200)
              id=$(jq -r '.id // empty' "$body")
              [ -n "$id" ] && curl -sS -o /dev/null -X DELETE \
                -H "Authorization: Bearer $token" "$api/applications/$PACKAGE/edits/$id" || true
              echo "::notice::$PACKAGE is published — fastlane can take this one."
              echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "::notice::Play does not know $PACKAGE yet — first release goes through the console."
              echo "ready=false" >> "$GITHUB_OUTPUT" ;;
            403)
              echo "::warning::The key cannot edit $PACKAGE (a fresh grant takes up to 36h). Console path."
              echo "ready=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::warning::Unexpected HTTP $status from the Play API — console path."
              cat "$body" || true
              echo "ready=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # The console path. Creates the app if it is not there, fills every form the
  # project's saved answers cover, then uploads the bundle and publishes it to
  # internal testing — all in one browser session on a signed-in profile.

  # One decision, made once: a package Play has never seen has to go through
  # the console; one it knows can go through the API. Asking Play beats asking
  # a human which case they are in, and it is why these are two workflows
  # rather than a flag someone has to remember to set.
  #
  # Publishing lives in called workflows rather than more jobs here because
  # workflow_dispatch allows at most ten inputs and the ten above are already
  # spoken for by FlavorFlow's event contract. A called workflow has no cap,
  # which is where the production flag can live.
  create-play-app:
    name: Create in Play
    needs: [gate, build-flavors]
    if: needs.gate.outputs.api_ready == 'false'
    uses: ./.github/workflows/create-play-app.yml
    with:
      project_id: ${{ inputs.project_id }}
      client_id: ${{ inputs.client_id }}
      client_name: ${{ inputs.client_name }}
      app_name: ${{ inputs.app_name }}
      package_name: ${{ inputs.package_name }}
      play_app_id: ${{ inputs.play_app_id }}
      force_create: ${{ inputs.force_create }}
      # An automated client.added never ships to production. Promotion is a
      # deliberate act: run the workflow by hand with the flag set.
      publish_to_production: false
    secrets: inherit

  release-update:
    name: Release update
    needs: [gate, build-flavors]
    if: needs.gate.outputs.api_ready == 'true'
    uses: ./.github/workflows/release-white-label-update.yml
    with:
      project_id: ${{ inputs.project_id }}
      client_id: ${{ inputs.client_id }}
      client_name: ${{ inputs.client_name }}
      app_name: ${{ inputs.app_name }}
      package_name: ${{ inputs.package_name }}
      play_app_id: ${{ inputs.play_app_id }}
      publish_to_production: false
    secrets: inherit

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    # An empty matrix is a hard error, so skip the job when the filter above
    # selected nothing rather than failing the run.
    if: needs.fetch-flavors.outputs.flavors != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      # After apply-flavor-action, so the images carry this client's branding:
      # they are rendered from the app's own composables under its own theme.
      - name: Generate store screenshots
        run: ./gradlew :app:storeScreenshots --stacktrace

      # Play's listing icon is 512x512 and the launcher densities top out at
      # 192, so it is generated from the same logo apply-flavor-action already
      # downloaded rather than upscaled from a mipmap.
      - name: Generate the store icon from the client logo
        run: |
          set -euo pipefail
          logo=$(find assets/logos -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.webp' \) 2>/dev/null | head -1)
          if [ -z "$logo" ]; then
            echo "::warning::No client logo found — the listing will have no icon."
            exit 0
          fi
          out=app/screenshots/en-US/images
          mkdir -p "$out"
          # Pad rather than crop: a non-square logo keeps its proportions and
          # Play gets the exact square it requires.
          convert "$logo" -resize 512x512 -background none -gravity center \
            -extent 512x512 "$out/icon.png"
          identify -format '  icon: %wx%h %m\n' "$out/icon.png"

      - name: Upload store screenshots
        uses: actions/upload-artifact@v7
        with:
          name: listing-${{ matrix.name }}
          path: app/screenshots/**/*.png
          if-no-files-found: error

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'

      # Signing secrets are absent in forks, where the debug APK above is still
      # worth having — so the release bundle is skipped rather than failing.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets — skipping the release bundle."
          fi

      - name: Decode the upload keystore
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # Outside the workspace so it cannot be picked up by an artifact glob.
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Play rejects a versionCode it has already seen. run_number is
          # monotonic per repo, which is enough while every client starts at
          # zero uploads; a client with existing releases needs its own counter.
          ./gradlew bundleRelease --stacktrace \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}

      - name: Verify the bundle is actually signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Must be the packaged output, not intermediates/: the intermediary
          # bundle is the pre-signing artifact and never carries a signature.
          aab=$(find . -path '*/outputs/bundle/release/*.aab' | head -1)
          [ -n "$aab" ] || { echo "::error::No .aab in outputs/bundle/release"; exit 1; }
          # An unsigned bundle still builds, so assert the signature block
          # rather than trusting a green build.
          if ! unzip -l "$aab" | grep -qiE 'META-INF/.*\.RSA'; then
            echo "::error::$aab has no signature block — it built unsigned."
            exit 1
          fi
          echo "Signed: $aab"
          jarsigner -verify "$aab" | head -1

      - name: Upload release bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.name }}.aab
          path: '**/outputs/bundle/release/*.aab'

      - name: Remove the keystore
        if: always() && steps.signing.outputs.available == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
