# Builds one branded APK per FlavorFlow client from this single codebase.
#
# 1. fetch-flavors-action  → pulls every client from your FlavorFlow project
# 2. apply-flavor-action   → rewrites theme (Color.kt/Theme.kt), app_name,
#                            applicationId and launcher icon for that client
# 3. ./gradlew assembleDebug → builds the APK, uploaded as a run artifact
#
# Setup (Settings → Secrets and variables → Actions):
#   Secret   TEST_API_KEY     = your FlavorFlow project API key
#   Variable TEST_PROJECT_ID  = your FlavorFlow project id
name: White-Label Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  fetch-flavors:
    runs-on: ubuntu-latest
    outputs:
      flavors: ${{ steps.fetch-flavors-action.outputs.flavors }}
    steps:
      - uses: actions/checkout@v5

      - name: Fetch flavors
        id: fetch-flavors-action
        uses: FlavorFlow-io/fetch-flavors-action@v1
        with:
          api-key: ${{ secrets.TEST_API_KEY }}
          project-id: ${{ vars.TEST_PROJECT_ID }}

  build-flavors:
    name: Build '${{ matrix.name }}'
    needs: fetch-flavors
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.fetch-flavors.outputs.flavors) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Apply branding
        uses: FlavorFlow-io/apply-flavor-action@v1
        with:
          project-api-key: ${{ secrets.TEST_API_KEY }}
          flavor: ${{ matrix.config }}
          project-type: 'android-native-compose'

      - uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}.apk
          path: '**/outputs/**/*.apk'
